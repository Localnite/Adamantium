; Settings of the additions to Project Reboot (bots, Save the World). Read when the DLL starts.
; A command line flag of the same name (-BOT_COUNT=5, -BOT_TEST ...) overrides the file.

[Bots]
; false = no bots at all (none spawned, none filled, none ticked)
Enabled=true
; bots added at match start (the 'Amount of bots to spawn' field of the window)
Count=1
; fill the match with bots just before the bus up to this many players in all, -1 = off
Fill=-1
; aim skill of every bot, -1 = every bot rolls its own
Skill=-1
; bots-only test match: the bus leaves on its own
Test=false
BusDelay=20
MaxSeconds=900
Exit=false
NavBuild=false
; playlist to play, empty = the default
Playlist=

[SaveTheWorld]
; false = Reboot leaves the Zone (Save the World) game mode alone
Enabled=true
; Zone map to open at start instead of Athena_Terrain, e.g. Zone_Onboarding_FarmsteadFort. Empty = Battle Royale.
Map=
GameMode=/Game/Blueprints/GameModeZone.GameModeZone_C
; more URL options for the map, without the leading ?  (worldId=...?theaterId=...?theaterMissionId=...?zoneThemeClass=...)
Options=
; frames after the Zone map is up before the server listens
ListenDelayFrames=150
; fetch the players' profiles from the backend as dedicated server commands
Mcp=true
